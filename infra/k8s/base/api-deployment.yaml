apiVersion: apps/v1
kind: Deployment
metadata:
  name: culinalink-api
spec:
  replicas: 2
  selector:
    matchLabels: {app: culinalink-api}
  template:
    metadata:
      labels: {app: culinalink-api}
    spec:
      containers:
        - name: api
          image: ghcr.io/ceortpsc/culinalink-api:VERSION
          ports: [{containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /health/ready, port: 8080}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health/live, port: 8080}
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: {cpu: '250m', memory: '256Mi'}
            limits: {cpu: '1', memory: '1Gi'}
          envFrom:
            - secretRef: {name: culinalink-api-secrets}
