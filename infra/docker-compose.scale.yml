services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: culinalink
      POSTGRES_USER: culinalink
      POSTGRES_PASSWORD: local-only-change-me
    ports: ['5432:5432']
  redis:
    image: redis:7-alpine
    command: ['redis-server','--appendonly','yes']
    ports: ['6379:6379']
  temporal:
    image: temporalio/auto-setup:latest
    environment:
      DB: postgresql
      DB_PORT: 5432
      POSTGRES_USER: culinalink
      POSTGRES_PWD: local-only-change-me
      POSTGRES_SEEDS: postgres
    depends_on: [postgres]
    ports: ['7233:7233']
  redpanda:
    image: redpandadata/redpanda:latest
    command: ['redpanda','start','--overprovisioned','--smp','1','--memory','1G','--reserve-memory','0M','--node-id','0','--check=false']
    ports: ['9092:9092','9644:9644']
